<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject|default:"AquaBill AI Notification" }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f3f4f6;
            padding: 40px 0;
        }
        .main-content {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 30px 40px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-logo {
            font-size: 36px;
            margin-bottom: 10px;
            display: inline-block;
        }
        .content {
            padding: 40px;
            line-height: 1.6;
            font-size: 16px;
            color: #374151;
        }
        .content h2 {
            color: #111827;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .button-wrapper {
            text-align: center;
            margin: 35px 0;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background-color: #3b82f6;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .footer {
            background-color: #f9fafb;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }
        .footer p {
            margin: 0 0 10px;
            color: #6b7280;
            font-size: 14px;
        }
        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 10px;
            font-size: 13px;
        }
        /* Highlight box for OTPs or amounts */
        .highlight-box {
            background-color: #f3f4f6;
            border: 1px dashed #cbd5e1;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin: 25px 0;
        }
        .highlight-text {
            font-size: 32px;
            font-weight: 700;
            color: #1e3a8a;
            letter-spacing: 4px;
            margin: 0;
        }
        @media only screen and (max-width: 600px) {
            .main-content {
                width: 100% !important;
                border-radius: 0 !important;
            }
            .header, .content, .footer {
                padding: 25px 20px !important;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td align="center">
                    <div class="main-content">
                        <!-- Header -->
                        <div class="header">
                            <div class="header-logo">💧</div>
                            <h1>AquaBill AI</h1>
                        </div>
                        
                        <!-- Main Body Content -->
                        <div class="content">
                            {% block content %}{% endblock %}
                        </div>
                        
                        <!-- Footer -->
                        <div class="footer">
                            <p>&copy; {% now "Y" %} AquaBill AI. All rights reserved.</p>
                            <p>You received this email because it's related to your AquaBill account.</p>
                            <div class="footer-links">
                                <a href="{{ frontend_url }}">Dashboard</a> | 
                                <a href="{{ frontend_url }}/contact">Support</a>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
